[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "indeed-bot"
version = "0.1.0"
description = "Stochastic wording. Deterministic agreement. A local multilingual bot with a Lean-verified response core."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Indeed Lab" }]
keywords = ["lean", "formal-verification", "language-detection", "bot", "humor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["lingua-language-detector>=2.1.1,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
indeed = "indeed_bot.cli:main"

[project.urls]
Homepage = "https://github.com/indeed-lab/indeed-bot"
Repository = "https://github.com/indeed-lab/indeed-bot"
Issues = "https://github.com/indeed-lab/indeed-bot/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: exercises the compiled Lean executable"]
